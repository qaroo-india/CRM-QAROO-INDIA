<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <title>Qaroo</title>
    <script>
      // Apply the saved theme before first paint, so a light-theme user never
      // sees a dark flash while React loads. Mirrors ThemeProvider's logic.
      (function () {
        try {
          var stored = localStorage.getItem('ims-theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Institute OS requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
